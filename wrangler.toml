name = "genztv-cf-pages"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]

# OpenNext output — Worker entry point + static assets
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

# Pages project config
[placement]
mode = "smart"

# ── Environment Variables ──
# These vars are available via process.env on Workers (nodejs_compat).
# Dashboard-set vars are NOT available via process.env — only via env parameter.
# So ALL vars needed by the app must be listed here.
#
# ⚠️ IMPORTANT: Replace placeholder values with your actual values before deploying!
# For better security, consider using `wrangler secret put <KEY>` for sensitive values.
[vars]
NODE_ENV = "production"

