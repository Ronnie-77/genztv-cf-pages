name = "genztv-cf-pages"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]

# OpenNext output — Worker entry point + static assets
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

# Pages project config
[placement]
mode = "smart"

# ── Environment Variables ──
# These vars are available via process.env on Workers (nodejs_compat).
# Dashboard-set vars are NOT available via process.env — only via env parameter.
# So ALL vars needed by the app MUST be listed here.
#
# ⚠️ CRITICAL: These values OVERRIDE the Cloudflare Dashboard "Variables and secrets"
# on every deploy. Make sure the values here match your actual production values.
# For secrets (ADMIN_PASSWORD, VAPID_PRIVATE_KEY), use `wrangler secret put <KEY>`
# which stores them encrypted (but they're NOT available via process.env on Workers).
#
# Since our code reads ALL vars via process.env, we MUST list everything here.
# If you need to keep credentials out of Git, use .gitignore for wrangler.toml
# or use a separate wrangler.production.toml that's not committed.
[vars]
NODE_ENV = "production"

# ── Neon PostgreSQL ──
# Your actual Neon connection string. This is the #1 most important value.
# Without the correct DATABASE_URL, the Neon adapter can't connect and
# the app falls back to PrismaClient which needs the Query Engine binary
# (not available on Workers) → 500 errors on ALL API routes.
DATABASE_URL = "postgresql://neondb_owner:npg_LD5oQt1wIZGx@ep-bold-brook-azp6jwl9-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"

# ── Admin Authentication ──
# Replace with your actual admin password. For better security, consider
# using `wrangler secret put ADMIN_PASSWORD` (but then you must modify
# the code to read it from the env fetch handler parameter instead of process.env).
ADMIN_PASSWORD = "Ronnie7700???"

